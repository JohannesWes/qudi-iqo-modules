# Example configuration for ODMR Frequency Tracking module
#
# This configuration shows how to set up the ODMR tracking module with
# PyRPL-based hardware frequency locking.
#
# Copy the relevant sections to your actual qudi configuration file.

global:
    startup_modules: [odmr_tracking_gui, time_series_gui]
    remote_modules_server:
        address: 'localhost'
        port: 12345

hardware:
    # Red Pitaya ODMR Lock Hardware (wraps PyRPL odmr_freq_lock module)
    redpitaya_odmr_lock:
        module.Class: 'redpitaya.redpitaya_odmr_lock.RedPitayaOdmrLockHardware'
        options:
            redpitaya_config_name: 'rpy_shared_config'
            redpitaya_hostname: '10.203.129.28'

    # Red Pitaya Stream Hardware (for error signal streaming)
    redpitaya_stream:
        module.Class: 'redpitaya.redpitaya_streaming.RedPitayaStreamingHardware'
        options:
            redpitaya_config_name: 'rpy_shared_config'
            redpitaya_hostname: '10.203.129.28'

    # Red Pitaya Finite Sampling (for ODMR scans)
    redpitaya_finite_sampling:
        module.Class: 'redpitaya.redpitaya_finite_sampling.RedPitayaFiniteSamplingHardware'
        options:
            redpitaya_config_name: 'rpy_shared_config'
            redpitaya_hostname: '10.203.129.28'

    # Microwave source (replace with your actual hardware)
    mw_source_synthnv:
        module.Class: 'microwave.mw_source_synthnv.MicrowaveSynthNV'
        options:
            serial_port: 'COM3'

logic:
    # Time series reader logic (handles streaming via TSR pattern)
    time_series_reader_logic:
        module.Class: 'time_series_reader_logic.TimeSeriesReaderLogic'
        options:
            max_frame_rate: 20
            channel_buffer_size: 100000
        connect:
            streamer: 'redpitaya_stream'

    # ODMR frequency tracking logic
    odmr_frequency_tracking_logic:
        module.Class: 'odmr_frequency_tracking_logic.OdmrFrequencyTrackingLogic'
        options:
            default_lock_bandwidth: 300      # Hz
            status_poll_interval: 0.5        # seconds (lock status only)
        connect:
            microwave: 'mw_source_synthnv'
            data_scanner: 'redpitaya_finite_sampling'
            odmr_lock_hw: 'redpitaya_odmr_lock'
            time_series_logic: 'time_series_reader_logic'

gui:
    # ODMR Tracking GUI
    odmr_tracking_gui:
        module.Class: 'odmr_tracking.odmr_tracking_gui.OdmrTrackingGui'
        connect:
            odmr_logic: 'odmr_frequency_tracking_logic'

    # Time Series GUI (for real-time error signal / frequency correction visualization)
    time_series_gui:
        module.Class: 'time_series.time_series_gui.TimeSeriesGui'
        connect:
            time_series_logic: 'time_series_reader_logic'


# ==============================================================================
# Usage Notes:
# ==============================================================================
#
# 1. The ODMR tracking module inherits ALL functionality from the standard
#    ODMR module, so all standard ODMR features are available:
#    - Frequency scanning
#    - CW mode
#    - Multi-range scanning
#    - Data fitting
#    - Data saving
#
# 2. Additional frequency tracking features:
#    - Linear fit extraction (slope measurement for lock configuration)
#    - Hardware-based frequency locking (PyRPL FPGA, integral or PI control)
#    - Independent stream and lock control
#    - Stream mode selection (error signal vs frequency correction)
#
# 3. Workflow:
#    a) Start qudi with this configuration
#    b) ODMR Tracking GUI opens with standard ODMR controls plus tracking docks
#    c) Run an ODMR scan first to see the resonance
#    d) Drag the fit region to select the linear slope region
#    e) Click "Fit Resonance" to extract the slope
#    f) Configure lock parameters (bandwidth, mode)
#    g) Click "Configure" then "Enable Lock" to start tracking
#    h) Open Time Series GUI to monitor error signal or frequency correction
#
# 4. Time Series Visualization:
#    The ODMR Tracking GUI delegates real-time data visualization to the
#    Time Series GUI. Both GUIs share the same TimeSeriesReaderLogic,
#    allowing you to see streaming data while controlling the lock.
#
# 5. Stream Mode Selection:
#    - Error Signal (LSB): Raw demodulated error signal for diagnostics
#    - Frequency Correction (Hz): Applied frequency offset for drift monitoring
#    Mode can only be changed when streaming is stopped.
#
# ==============================================================================
