# Example qudi configuration for Motor Scan functionality
# Copy the relevant sections to your main configuration file

# =============================================================================
# Hardware: Thorlabs KDC101 Motor Stage (for XY scanning)
# =============================================================================

thorlabs_xy_stage:
    module.Class: 'motor.thorlabs_kdc101_kinesis.ThorlabsKDC101Kinesis'
    options:
        axis_config:
            x:
                serial: 27XXXXXX  # Replace with your X-axis serial number
                pos_min: 0.0
                pos_max: 0.050    # 50mm travel range
            y:
                serial: 27YYYYYY  # Replace with your Y-axis serial number
                pos_min: 0.0
                pos_max: 0.050    # 50mm travel range
        default_velocity: 0.001   # 1 mm/s
        auto_home: false

# =============================================================================
# Logic Modules
# =============================================================================

# Motor Scan Logic - orchestrates XY scanning with ODMR or streaming
motor_scan_logic:
    module.Class: 'motor_scan.scan_logic.MotorScanLogic'
    connect:
        motor_hardware: thorlabs_xy_stage
        odmr_logic: odmr_logic              # For STEP_ODMR mode
        time_series_logic: time_series_reader_logic  # For CONTINUOUS_STREAM mode
    options:
        default_scan_mode: 'STEP_ODMR'      # or 'CONTINUOUS_STREAM'
        position_poll_interval: 0.05        # 50ms position polling for continuous mode
        odmr_fit_function: 'fit_hyperfine'  # Fitting function for ODMR analysis
        require_homed_before_scan: true      # Refuse scans until stages report a valid home
        home_before_scan: false              # Set true to home automatically before each scan

# ODMR Logic (if using STEP_ODMR mode)
odmr_logic:
    module.Class: 'odmr_logic.OdmrLogic'
    connect:
        microwave: windfreak_synth
        data_scanner: red_pitaya_odmr_scanner
    options:
        default_scan_mode: 'JUMP_LIST'
        save_thumbnails: true

# Time Series Reader Logic (if using CONTINUOUS_STREAM mode)
time_series_reader_logic:
    module.Class: 'time_series_reader_logic.TimeSeriesReaderLogic'
    connect:
        streamer: redpitaya_instream
    options:
        max_frame_rate: 20
        trace_window_size: 5.0  # seconds
        channel_buffer_size: 1048576

# =============================================================================
# GUI
# =============================================================================

motor_scan_gui:
    module.Class: 'motor_scan.motor_scan_gui.MotorScanGui'
    connect:
        motor_scan_logic: motor_scan_logic

# =============================================================================
# Usage Notes
# =============================================================================
#
# STEP_ODMR Mode:
#   - Motor moves to each grid point and stops
#   - ODMR scan is executed at each position
#   - fit_hyperfine() analyzes the spectrum
#   - Results stored: center frequency, linewidth, splitting per point
#
# CONTINUOUS_STREAM Mode:
#   - Motor moves continuously through the scan area
#   - Streaming data is binned to grid cells based on position
#   - Variable-length time traces stored per grid cell
#   - Mean values displayed in GUI
#
# API Example:
#   logic = motor_scan_logic
#   logic.set_scan_ranges({'x': (0.0, 0.01), 'y': (0.0, 0.01)})  # 10mm x 10mm
#   logic.set_scan_resolution({'x': 20, 'y': 20})  # 20x20 grid
#   logic.set_scan_mode('STEP_ODMR')
#   logic.start_scan()

# =============================================================================
# DUMMY CONFIGURATION (for testing without hardware)
# =============================================================================

# Uncomment the following section to use dummy hardware for testing

xy_stage_dummy:
    module.Class: 'dummy.motor_scan_dummy.XYStageDummy'
    options:
        velocity: 0.002          # 2 mm/s movement speed
        movement_delay: 0.1      # seconds between position updates
        position_noise: 0.00001  # 10 µm position noise

odmr_logic_dummy:
    module.Class: 'dummy.odmr_logic_dummy.OdmrLogicDummy'
    options:
        center_frequency: 2.87e9    # Hz
        hyperfine_splitting: 2.2e6  # Hz
        scan_duration: 0.5          # seconds (fast for testing)

instream_dummy:
    module.Class: 'dummy.data_instream_dummy.InStreamDummy'
    options:
        channel_names:
            - 'Signal'
        channel_units:
            - 'V'
        channel_signals:
            - 'sine'
        sample_timing: 'CONSTANT'

time_series_reader_dummy:
    module.Class: 'time_series_reader_logic.TimeSeriesReaderLogic'
    connect:
        streamer: instream_dummy

motor_scan_logic_dummy:
    module.Class: 'motor_scan.scan_logic.MotorScanLogic'
    connect:
        motor_hardware: xy_stage_dummy
        odmr_logic: odmr_logic_dummy
        time_series_logic: time_series_reader_dummy
    options:
        default_scan_mode: 'STEP_ODMR'
        position_poll_interval: 0.1

motor_scan_gui_dummy:
    module.Class: 'motor_scan.motor_scan_gui.MotorScanGui'
    connect:
        motor_scan_logic: motor_scan_logic_dummy
